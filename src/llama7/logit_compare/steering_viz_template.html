<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steering Δlogits Visualization</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {{
    --bg: #0f1216;
    --card: #171b21;
    --muted: #9aa4ad;
    --text: #e6edf3;
    --accent: #2a9d8f;
    --chipbg: #1f252c;
    --border: #222a33;
  }}
  html, body {{
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
    margin: 0;
    padding: 0;
  }}
  .wrap {{
    max-width: 1100px;
    margin: 32px auto 64px;
    padding: 0 16px;
  }}
  .card {{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }}
  h1 {{
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }}
  .prompt {{
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 10px;
    white-space: pre-wrap;
  }}
  .response {{
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 8px;
  }}
  .legend {{
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
  }}
  .grid {{
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }}
  .cell {{
    background: #141a20;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }}
  .token {{
    background: #11161b;
    border: 1px solid #1b232c;
    border-radius: 10px;
    padding: 8px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 14px;
    white-space: pre-wrap;
    min-height: 24px;
  }}
  .under {{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }}
  .chip {{
    position: relative;
    background: var(--chipbg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    overflow: hidden;
  }}
  .chip .bar {{
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 8px;
  }}
  .chip .chip-text {{
    position: relative;
    z-index: 2;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }}
  .chip .chip-score {{
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Steering Δlogits (Promoted Tokens per Step)</h1>
      <div class="prompt"><strong>Prompt:</strong> {prompt}</div>
      <div class="response"><strong>Response (base, greedy):</strong> {response}</div>
      <div class="legend">Under each generated token, the top {topk} <em>promoted</em> tokens by Δlogit (steered − base). Bars reflect relative magnitude within that step.</div>
      <div class="grid">
        {grid}
      </div>
    </div>
  </div>
</body>
</html>
